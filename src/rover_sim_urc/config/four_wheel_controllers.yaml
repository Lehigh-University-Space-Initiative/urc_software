/assignment1_four_wheel/controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    wheel_velocity_controller:
      type: forward_command_controller/ForwardCommandController
/assignment1_four_wheel/joint_state_broadcaster:
  ros__parameters:
    use_local_topics: true
    joints: [front_left_wheel_joint, rear_left_wheel_joint, front_right_wheel_joint, rear_right_wheel_joint]
    interfaces: [position, velocity]
/assignment1_four_wheel/wheel_velocity_controller:
  ros__parameters:
    joints: [front_left_wheel_joint, rear_left_wheel_joint, front_right_wheel_joint, rear_right_wheel_joint]
    interface_name: velocity
